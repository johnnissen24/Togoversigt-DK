<script>
'use strict';
const hiddenCodes=new Set('BG BM BF CG CM CF CB CX HG HM HF HB PG PM GL GD GK GX G GM FG GB TG TM TF RG RB FW GF FX MF FB M FM FE ØM SM VM AM NM'.split(' ')); // Kun farvemarkering; aldrig filtrering
const nonPassengerTypes=new Set(['Freight','Engineering','Light']);
const $=id=>document.getElementById(id);
const state={sockets:new Map(),status:new Map(),snapshots:new Map()};

const operatorGroups=[
 ['DB Cargo Scandinavia','G GS GD GK GM GF GB'],
 ['Hector Rail','HG HS HK HM HP HF HB'],
 ['TX Logistik','TG TS TM TF TB'],
 ['Green Cargo','CG CS CM'],
 ['Viking Rail','WG WS WM WF WB'],
 ['Contec Rail','KG KM KB'],
 ['Spitzke','ZG ZM ZB'],
 ['Banedanmark','BM BS'],
 ['DSB','L IL IC RØ RV RR EC EX EJ IE FP SK FS M FM EP IB'],
 ['DSB Vores Tog','AR AM AX AF AE AP PM'],
 ['Lokaltog','LF LM LP LR PM'],
 ['Nordjyske Jernbaner','NR NM NP PM NF'],
 ['Midtjyske Jernbaner','MR MM MP PM'],
 ['SJ AB','SM SP XP XM'],
 ['Veterantog (flere operatører)','VM VP'],
 ['VR Sverige AB','ØM ØP'],
 ['DSB S-tog','MS NS PS ØS']
];
const operatorsByCode=new Map();
for(const [operator,codes] of operatorGroups){for(const code of codes.split(' ')){
 if(!operatorsByCode.has(code))operatorsByCode.set(code,[]);
 operatorsByCode.get(code).push(operator);
}}
function operatorOf(t){
 const code=String(val(t,'Product','product')||'').trim().toUpperCase();
 const names=operatorsByCode.get(code)||[];
 return names.length===1?names[0]:names.length>1?'Flere mulige: '+names.join(' / '):'Ikke oplyst';
}
const operatorRowColors={
 "DB Cargo Scandinavia": "#254c48",
 "Hector Rail": "#483c67",
 "TX Logistik": "#493d29",
 "Green Cargo": "#254d35",
 "Viking Rail": "#2c4966",
 "Contec Rail": "#55402d",
 "Spitzke": "#4d334e",
 "Banedanmark": "#37505a",
 "DSB": "#542f36",
 "DSB Vores Tog": "#514530",
 "Lokaltog": "#314d40",
 "Nordjyske Jernbaner": "#3c4566",
 "Midtjyske Jernbaner": "#4b403b",
 "SJ AB": "#25495a",
 "Veterantog (flere operatører)": "#514a32",
 "VR Sverige AB": "#3e345b",
 "DSB S-tog": "#4b3150"
};
const operatorMarks={
 'DB Cargo Scandinavia':'DB','Hector Rail':'HR','TX Logistik':'TX','Green Cargo':'GC',
 'Viking Rail':'VR','Contec Rail':'CR','Spitzke':'SZ','Banedanmark':'BD',
 'DSB':'DSB','DSB Vores Tog':'VT','Lokaltog':'LT','Nordjyske Jernbaner':'NJ',
 'Midtjyske Jernbaner':'MJ','SJ AB':'SJ','Veterantog':'VT','VR Sverige AB':'VR',
 'DSB S-tog':'S'
};
function addOperatorCell(tr,t){
 const name=operatorOf(t),td=document.createElement('td');td.className='operator-cell';
 const mark=document.createElement('span');mark.className='op-mark';
 mark.textContent=operatorMarks[name]||'?';mark.title='Tekstsymbol – ikke officielt logo';
 const label=document.createElement('span');label.className='op-name';label.textContent=name;
 td.append(mark,label);tr.append(td);
}
function val(t,...keys){for(const k of keys)if(t[k]!==undefined&&t[k]!==null&&t[k]!=='')return t[k];return null}
function parseDate(x){if(!x)return null;if(typeof x==='number')return new Date(x);let m=String(x).match(/^(\d{2})-(\d{2})-(\d{4})[ T](\d{2}):(\d{2})(?::(\d{2}))?/);if(m)return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0));const d=new Date(x);return Number.isFinite(d.getTime())?d:null}
function trainTime(t){return val(t,'ScheduleTimeDeparture','ScheduleTimeArrival','ScheduleTime','ScheduledDepartureTime','ScheduledArrivalTime','EstimatedTimeDeparture','EstimatedTimeArrival')}
function fmtTime(x){const d=parseDate(x);return d?d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'–'}
function isZeroClock(x){return typeof x==='string' && /(?:^|[ T])00[:.]00[:.]00(?:$|\D)/.test(x) || x==='00.00.00' || x==='00:00:00'}
function displayScheduled(x){
 if(!x||isZeroClock(x))return '';
 const d=parseDate(x);if(!d)return '–';
 const h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0'),sec=String(d.getSeconds()).padStart(2,'0');
 return sec==='30'?`${h}.${m}½`:`${h}.${m}.${sec}`;
}
function stationCase(x){return String(x||'–').replace(/[A-Za-zÆØÅæøå]+/g,part=>part.charAt(0).toLocaleUpperCase('da-DK')+part.slice(1).toLocaleLowerCase('da-DK'))}
function eventTime(t){
 // FORVENTET har altid forrang, også når den er tidligere end begge planlagte tider.
 // Sammenlign hele tidsstempler (inkl. dato), men vis kun klokkeslæt.
 const valid=keys=>keys.map(k=>isZeroClock(t[k])?null:parseDate(t[k]))
   .filter(d=>d&&Number.isFinite(d.getTime())&&d.getFullYear()>2000);
 const expected=valid(['EstimatedTimeArrival','EstimatedTimeDeparture']);
 if(expected.length)return Math.min(...expected.map(d=>d.getTime()));
 const planned=valid(['ScheduleTimeArrival','ScheduleTimeDeparture','ScheduleTime','ScheduledArrivalTime','ScheduledDepartureTime']);
 return planned.length?Math.min(...planned.map(d=>d.getTime())):Number.POSITIVE_INFINITY;
}
function sortTime(t){return eventTime(t)}
function isAlreadyGone(t, now=Date.now()){
 // En registreret faktisk afgang eller afgået-status skjules straks.
 const status=String(val(t,'Status','TrainStatus','DepartureStatus','RunningStatus')||'').toLowerCase();
 if(['departed','afgået','afgaaet','passed','left'].includes(status))return true;
 const actual=val(t,'ActualTimeDeparture','ActualDepartureTime','RealTimeDeparture');
 const actualDate=isZeroClock(actual)?null:parseDate(actual);
 if(actualDate&&actualDate.getFullYear()>2000&&actualDate.getTime()<=now)return true;
 // Behold toget indtil fem minutter efter seneste planlagte ankomst/afgang.
 // Hvis en forventet tid er senere, er det i stedet den, der styrer fristen.
 const dates=keys=>keys.map(k=>isZeroClock(t[k])?null:parseDate(t[k]))
   .filter(d=>d&&Number.isFinite(d.getTime())&&d.getFullYear()>2000)
   .map(d=>d.getTime());
 const planned=dates(['ScheduleTimeArrival','ScheduleTimeDeparture','ScheduleTime','ScheduledArrivalTime','ScheduledDepartureTime']);
 const expected=dates(['EstimatedTimeArrival','EstimatedTimeDeparture']);
 const plannedEnd=planned.length?Math.max(...planned):-Infinity;
 const expectedEnd=expected.length?Math.max(...expected):-Infinity;
 const reference=Math.max(plannedEnd,expectedEnd);
 return Number.isFinite(reference)&&now>reference+5*60*1000;
}
function reasons(t){const a=[];const product=val(t,'Product','product');const trainType=val(t,'TrainType','trainType','serviceType');const stopType=val(t,'StopType','stopType');if(hiddenCodes.has(product))a.push('Skjult produktkode');if(stopType==='TechnicalStop')a.push('TechnicalStop');if(stopType==='PassThrough')a.push('PassThrough');if(trainType&&trainType!=='Passenger')a.push('TrainType: '+trainType);return a}
function keyOf(t){
 const number=val(t,'TrainId','PublicTrainId','TrainID','id','number');
 const product=val(t,'Product','product')||'';
 // Identitet uden særskilt gemt dato; tid bruges kun som nødløsning.
 const trip=val(t,'ScheduleTimeDeparture','ScheduleTimeArrival','ScheduleTime','ScheduledDepartureTime','ScheduledArrivalTime');
 // Forskellige kørsler med samme tognummer må ikke overskrive hinanden.
 return number?`${number}|${product}|${trip||''}`:JSON.stringify(t).slice(0,500);
}
function ingest(obj,source){
 const data=obj?.data?.Trains?obj.data:obj?.Trains?obj:null;
 if(!data||!Array.isArray(data.Trains))return false;
 // Erstat altid hele seneste stations-/sporbillede fra denne forbindelse.
 // Ingen tidligere tog beholdes, når de ikke længere optræder i nye data.
 const latest=new Map();
 for(const t of data.Trains){if(t&&typeof t==='object')latest.set(keyOf(t),t)}
 state.snapshots.set(source,latest);
 render();return true;
}
function routeOf(t){
 const routes=Array.isArray(t.Routes)?t.Routes:[];
 const seen=new Set(), names=[];
 for(const r of routes){
  if(!r||typeof r!=='object')continue;
  const a=r.OriginStationId, b=r.DestinationStationId;
  const route=stationCase(a)+' → '+stationCase(b);
  if(!seen.has(route)){seen.add(route);names.push(route)}
 }
 return names.length?names.join(' / '):'–';
}
function departureDisplay(t){
 const raw=val(t,'ScheduleTimeDeparture','ScheduledDepartureTime');
 if(raw&&!isZeroClock(raw))return displayScheduled(raw);
 // Udgangsstation PA: 00:00:00 betyder en tom afgangscelle.
 const routes=Array.isArray(t.Routes)?t.Routes:[];
 const station=stationCode();
 const startsHere=routes.some(r=>String(r?.OriginStationId||'').toUpperCase()===station);
 const endsHere=routes.some(r=>String(r?.DestinationStationId||'').toUpperCase()===station);
 if(startsHere||endsHere)return '';
 // Tog på en gennemgående rute uden en registreret afgang her.
 return routes.length?'Aflyst':'';
}
function estimatedOf(t){
 const options=['EstimatedTimeArrival','EstimatedTimeDeparture']
   .map(k=>isZeroClock(t[k])?null:parseDate(t[k])).filter(d=>d&&Number.isFinite(d.getTime())&&d.getFullYear()>2000);
 return options.length?fmtTime(new Date(Math.min(...options.map(d=>d.getTime())))):'–';
}
function addCell(tr,value,cls){const td=document.createElement('td');if(cls)td.className=cls;td.textContent=value??'–';tr.append(td);return td}
let scheduleRequestId=0;
let currentTrainDiagnostics=null;
$('toggleTrainDiagnostics').addEventListener('click',()=>{
 const panel=$('trainDiagnostics');
 panel.hidden=!panel.hidden;
 $('toggleTrainDiagnostics').textContent=panel.hidden?'Vis diagnose':'Skjul diagnose';
});
$('downloadTrainDiagnostics').addEventListener('click',()=>{
 if(!currentTrainDiagnostics)return;
 const blob=new Blob([JSON.stringify(currentTrainDiagnostics,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='MitTog_diagnose_'+String(currentTrainDiagnostics.train?.Product||'Tog')+'_'+String(currentTrainDiagnostics.train?.PublicTrainId||currentTrainDiagnostics.train?.TrainId||'ukendt')+'.json';
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
});
function updateTrainDiagnostics(){
 if(!currentTrainDiagnostics)return;
 const d=currentTrainDiagnostics;
 const routes=Array.isArray(d.train?.Routes)?d.train.Routes:[];
 const summary={
  tog:String(d.train?.Product||'')+' '+String(d.train?.PublicTrainId||d.train?.TrainId||''),
  ruter:routes.length,
  stationer_i_Routes_Stations:routes.map(r=>Array.isArray(r.Stations)?r.Stations.length:0),
  andre_stopfelter:routes.map(r=>Object.fromEntries(['Stops','CallingPoints','Timetable','Schedule','TrainStops','StationStops','RouteStations'].filter(k=>Array.isArray(r[k])).map(k=>[k,r[k].length]))),
  stop_i_visningen:d.stops?.map(x=>({station:x.station,ankomst:x.arrival,afgang:x.departure,forventet:x.estimated,aflyst:x.cancelled}))||[],
  stationsopslag:d.lookups,
  datakilde:'MitTog WebSocket – aktuelt stationssnapshot'
 };
 $('trainDiagnosticsText').textContent=JSON.stringify(summary,null,2);
}

function fetchStationTrain(code, target, timeout=2800){
 return new Promise(resolve=>{
  let done=false, sockets=[],timer;const diag={station:code,connections:[],messages:0,trainsReceived:0,matches:0};
  const finish=(result)=>{if(done)return;done=true;clearTimeout(timer);sockets.forEach(w=>{try{w.close()}catch{}});resolve({train:result,diagnostic:diag})};
  const matches=x=>{
   const ids=o=>[o?.TrainId,o?.PublicTrainId,o?.TrainID].filter(v=>v!==null&&v!==undefined).map(String);
   const a=ids(x),b=ids(target);
   const same=a.some(id=>b.includes(id));
   const ap=String(x?.Product||'').toUpperCase(),bp=String(target?.Product||'').toUpperCase();
   return same&&(!ap||!bp||ap===bp);
  };
  timer=setTimeout(()=>finish(null),timeout);
  for(const type of ['departure','arrival']){
   try{
    const ws=new WebSocket(`wss://api.mittog.dk/api/ws/${type}/${encodeURIComponent(code)}/dinstation/`);
    sockets.push(ws);const connection={type,status:'forbinder'};diag.connections.push(connection);
    ws.onopen=()=>{connection.status='forbundet'};
    ws.onclose=()=>{connection.status=connection.status==='forbundet'?'lukket':connection.status};
    ws.onmessage=e=>{try{
     const o=JSON.parse(e.data),trains=o?.data?.Trains||o?.Trains;diag.messages++;
     if(Array.isArray(trains)){
      diag.trainsReceived+=trains.length;
      const found=trains.filter(matches);diag.matches+=found.length;
      if(found.length)finish(found.reduce((acc,x)=>({...acc,...x}),{}));
     }
    }catch{}};
    ws.onerror=()=>{};
   }catch{}
  }
 });
}
async function enrichScheduleStops(stops,train,body,requestId){
 const current=stationCode();
 // & og % markerer udenlandske stationskoder i MitTogs rutedata.
 // Slå kun danske stationer op, og undgå at fjerne præfikset før landefilteret.
 const candidates=[...new Set(stops.map(x=>String(x.station||'').trim().toUpperCase()))]
  .filter(x=>x&&!/^[&%]/.test(x)&&x!==current&&/^[A-ZÆØÅ0-9]{1,7}$/.test(x));
 const progress=document.createElement('p');progress.className='schedule-note';
 progress.textContent=`Henter danske stationsdata: 0/${candidates.length} stationer…`;
 body.insertBefore(progress,body.querySelector('.schedule-table')?.parentElement||null);
 let next=0,finished=0,found=0;
 async function worker(){
  while(next<candidates.length&&requestId===scheduleRequestId){
   const code=candidates[next++];
   const result=await fetchStationTrain(code,train,4500);
   const data=result.train;
   if(currentTrainDiagnostics&&requestId===scheduleRequestId){currentTrainDiagnostics.lookups.push(result.diagnostic);updateTrainDiagnostics()}
   if(requestId!==scheduleRequestId)return;
   finished++;
   if(data){
    found++;
    const stop=stops.find(x=>String(x.station||'').replace(/^[&%]/,'').toUpperCase()===code);
    if(stop){
     stop.arrival=val(data,'ScheduleTimeArrival','ScheduledArrivalTime')||stop.arrival;
     stop.departure=val(data,'ScheduleTimeDeparture','ScheduledDepartureTime')||stop.departure;
     stop.estimated=val(data,'EstimatedTimeArrival','EstimatedTimeDeparture')||stop.estimated;
     const tr=stop.row;
     if(tr){
      tr.cells[1].textContent=stop.arrival&&!isZeroClock(stop.arrival)?displayScheduled(stop.arrival):'';
      tr.cells[2].textContent=stop.departure&&!isZeroClock(stop.departure)?displayScheduled(stop.departure):'';
      tr.cells[3].textContent=stop.estimated&&!isZeroClock(stop.estimated)?fmtTime(stop.estimated):'';
     }
    }
   }
   progress.textContent=`Henter stationsdata: ${finished}/${candidates.length} · tider fundet ved ${found} stationer`;
  }
 }
 await Promise.all(Array.from({length:Math.min(4,candidates.length)},worker));
 if(requestId===scheduleRequestId)progress.textContent=`Danske stationsopslag afsluttet: ${found} af ${candidates.length} stationer leverede data for toget. Tomme felter er ikke oplyst af MitTog.`;
}
function showTrainSchedule(t){
 const requestId=++scheduleRequestId;
 const dlg=$('scheduleDialog'),body=$('scheduleBody');body.replaceChildren();
 $('trainDiagnostics').hidden=true;$('toggleTrainDiagnostics').textContent='Vis diagnose';
 currentTrainDiagnostics={train:JSON.parse(JSON.stringify(t)),stops:[],lookups:[],selectedStation:stationCode()};
 const product=val(t,'Product','product')||'',num=val(t,'PublicTrainId','TrainId','number','id')||'–';
 $('scheduleTitle').textContent='Køreplan – '+(product?product+' ':'')+num;
 const note=document.createElement('p');note.className='schedule-note';
 note.textContent='Udenlandske stationer vises uden tider. Kun danske stationer undersøges for ankomst og afgang.';body.append(note);
 const get=(o,...keys)=>{for(const k of keys)if(o?.[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null};
 const stops=[];
 const stationKey=x=>String(x||'').toUpperCase();
 function addStops(arr){
  if(!Array.isArray(arr))return;
  for(const x of arr){
   if(!x||typeof x!=='object')continue;
   const station=get(x,'StationId','StationName','stationId','stationName','Name','name','LocationId');
   if(!station)continue;
   const arrival=get(x,'ScheduleDateTimeArrival','ScheduleTimeArrival','ScheduledArrivalTime','ArrivalTime','Arrival');
   const departure=get(x,'ScheduleDateTimeDeparture','ScheduleTimeDeparture','ScheduledDepartureTime','DepartureTime','Departure');
   const estimated=get(x,'ExpectedDateTimeArrival','ExpectedDateTime','ExpectedDateTimeDeparture','EstimatedTimeArrival','EstimatedTimeDeparture','ExpectedArrival','ExpectedDeparture');
   const cancelled=['IsCancelled','IsCancelledArrival','IsCancelledDeparture'].some(k=>x[k]===true);
   stops.push({station,arrival,departure,estimated,cancelled});
  }
 }
 for(const r of Array.isArray(t.Routes)?t.Routes:[]){

 name=String(name||'').trim();code=String(code||'').trim().toUpperCase();

 const key=normalizeStation(name)+'|'+code;if(stationKeys.has(key))return false;
 stationKeys.add(key);stationsByName.set(normalizeStation(name),code);
 if(!stationsByCode.has(code))stationsByCode.set(code,name);
 const option=document.createElement('option');option.value=name;option.label=code;datalist.appendChild(option);return true;
}

function stationCode(){const raw=$('station').value.trim();if(!raw)return null;const key=normalizeStation(raw);return stationsByName.get(key)|| (stationsByCode.has(raw.toUpperCase())?raw.toUpperCase():(/^[A-Za-zÆØÅæøå]{2,5}$/.test(raw)?raw.toUpperCase():null))}
function connect(){
 const station=stationCode();
 if(!station){$('status').textContent='Vælg en station fra listen eller indtast en gyldig stationskode';$('status').className='error';return}
 disconnect();state.status.clear();state.snapshots.clear();render();
 $('stationName').textContent=stationsByCode.get(station)||station;
 const base='wss://api.mittog.dk/api/ws';
 connectOne('Afgange',`${base}/departure/${station}/dinstation/`);
 connectOne('Ankomster',`${base}/arrival/${station}/dinstation/`);
 for(let track=1;track<=12;track++)connectOne('Spor '+track,`${base}/track/${station}/${track}/position/`);
}


// Selvstændig PDF-generator: ingen eksterne biblioteker, intet udskriftsvindue.
function downloadTrainPdf(){
 const source=document.querySelector('.tablewrap table');
 const headers=[...source.querySelectorAll('thead th')].map(x=>x.textContent.trim());
 const trs=[...source.querySelectorAll('tbody tr')];
 const rows=trs.map(tr=>[...tr.cells].map((c,i)=>{
   // PDF: vis kun operatørens navn, ikke det dekorative kode-symbol.
   const label=i===2 ? c.querySelector('.op-name') : null;
   return (label||c).textContent.trim().replace(/\s+/g,' ');
 }));
 const now=new Date(),pad=n=>String(n).padStart(2,'0');
 const stamp=`${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}_${pad(now.getHours())}.${pad(now.getMinutes())}`;
 const station=($('stationName').textContent||'Station').trim();
 const filename=`${stamp}_Togoversigt_${station.replace(/[\/:*?"<>|]/g,'').replace(/\s+/g,'_')}.pdf`;
 const W=842,H=595, left=24,top=65,rowH=22,headH=26;
 const widths=[40,83,174,188,94,94,121]; // total 794 = A4 landscape minus 48pt
 const xPositions=[left];for(const w of widths)xPositions.push(xPositions.at(-1)+w);
 const esc=x=>String(x).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 const winAnsi=x=>String(x).replace(/[→➜]/g,'->').replace(/[←]/g,'<-').replace(/[–—]/g,'-').replace(/[^\x20-\x7e\u00a0-\u00ff]/g,'?');
 const text=(x,y,str,size=9,bold=false,color='0.10 0.16 0.24')=>
   `${color} rg BT /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${esc(winAnsi(str))}) Tj ET\n`;
 const fill=(x,y,w,h,r,g,b)=>`${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f\n`;
 const hexRGB=h=>{let m=/^#([0-9a-f]{6})$/i.exec(h);return m?[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)/255):[.55,.63,.72]};
 const fit=(str,width,fontSize=9)=>{let s=winAnsi(str);const max=Math.max(3,Math.floor((width-10)/(fontSize*.51)));return s.length>max?s.slice(0,max-3)+'...':s};
 const pages=[];let page='',y=0, count=0;
 function newPage(){
   if(page)pages.push(page);
   page=fill(0,0,W,H,1,1,1);
   page+=text(left,H-34,'Togoversigt Danmark - '+station,16,true);
   page+=text(W-183,H-33,stamp.replace('_','  '),9,false);
   y=H-top;
   page+=fill(left,y-headH,W-left*2,headH,.12,.18,.27);
   headers.forEach((h,i)=>page+=text(xPositions[i]+5,y-17,fit(h,widths[i],9),9,true,'1 1 1'));
   y-=headH;count=0;
 }
 newPage();
 if(!rows.length){
   page+=text(left+5,y-24,'Ingen tog vises i den aktuelle oversigt.',10);
 }else{
   rows.forEach((cells,idx)=>{
     if(y-rowH<31)newPage();
     const rgb=hexRGB(getComputedStyle(trs[idx]).getPropertyValue('--operator-row').trim());
     const tint=rgb.map(v=>.90+v*.10);
     page+=fill(left,y-rowH,W-left*2,rowH,...tint);
     page+=fill(left,y-rowH,4,rowH,...rgb);
     cells.forEach((value,i)=>{
       const isCancelled=value.trim().toLowerCase()==='aflyst';
       page+=text(xPositions[i]+6,y-15,fit(value,widths[i],8.6),8.6,false,isCancelled?'0.76 0.10 0.14':'0.10 0.16 0.24');
     });
     page+=fill(left,y-rowH,W-left*2,.35,.82,.85,.89);
     y-=rowH;count++;
   });
 }
 pages.push(page);
 // PDF 1.4 med WinAnsi Helvetica og korrekt xref, som Acrobat kan åbne.
 const objects=[null];
 const add=obj=>{objects.push(obj);return objects.length-1};
 const catalog=add(''),pagesRoot=add('');
 const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const pageRefs=[];
 for(const stream of pages){
   const bytes=Array.from(stream,c=>c.charCodeAt(0)&255);
   const content=add(`<< /Length ${bytes.length} >>\nstream\n${stream}endstream`);
   const ref=add(`<< /Type /Page /Parent ${pagesRoot} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${content} 0 R >>`);
   pageRefs.push(ref);
 }
 objects[catalog]=`<< /Type /Catalog /Pages ${pagesRoot} 0 R >>`;
 objects[pagesRoot]=`<< /Type /Pages /Kids [${pageRefs.map(n=>n+' 0 R').join(' ')}] /Count ${pageRefs.length} >>`;
 let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n',offsets=[0];
 for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`;}
 const xref=pdf.length;
 pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
 pdf+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 const blob=new Blob([Uint8Array.from(pdf,c=>c.charCodeAt(0)&255)],{type:'application/pdf'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
$('savePdf').addEventListener('click',()=>{
 const btn=$('savePdf'),old=btn.textContent;
 btn.disabled=true;btn.textContent='Gemmer PDF…';
 try{downloadTrainPdf()}catch(err){console.error(err);alert('PDF kunne ikke gemmes: '+(err?.message||err))}
 finally{btn.disabled=false;btn.textContent=old}
});

$('stationForm').onsubmit=e=>{e.preventDefault();connect()};
